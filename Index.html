<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Educational Roulette</title>
    <style>
        :root {
            --casino-green: #0b5e28;
            --roulette-red: #d32f2f;
            --roulette-black: #212121;
            --text-light: #ffffff;
            --highlight: #ffd700;
        }
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--casino-green);
            color: var(--text-light);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1, h2, h3 { text-align: center; }
        .screen {
            display: none; width: 100%; max-width: 900px;
            background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px;
        }
        .active-screen { display: block; }
        
        button {
            background-color: #333; color: white; border: 2px solid #555;
            padding: 15px 20px; margin: 10px; font-size: 16px;
            border-radius: 8px; cursor: pointer; width: calc(100% - 20px);
            max-width: 300px; transition: 0.2s;
        }
        button:hover { background-color: #444; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #222; color: #777; border-color: #333; cursor: not-allowed; }
        .btn-selected { background-color: var(--highlight) !important; color: black !important; font-weight: bold; }
        
        .menu-grid { display: flex; flex-wrap: wrap; justify-content: center; }
        .controls-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; }

        /* Board CSS */
        .board-wrapper { display: flex; flex-direction: row; justify-content: center; gap: 10px; margin: 20px auto; max-width: 600px; touch-action: none; }
        .outside-bets-container { display: flex; flex-direction: row; gap: 5px; margin-top: 55px; }
        .outside-col { display: flex; flex-direction: column; gap: 5px; width: 80px; }
        .inside-bets-container { display: flex; flex-direction: column; gap: 5px; width: 200px; }
        .board-row { display: flex; gap: 5px; justify-content: center; height: 50px; }
        
        .board-cell, .outside-cell {
            flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: 14px; font-weight: bold; border: 2px solid white; border-radius: 4px;
            cursor: pointer; transition: transform 0.1s;
        }
        .board-cell { font-size: 18px; }
        
        .zero-cell { background-color: #388e3c; }
        .red-cell { background-color: var(--roulette-red); }
        .black-cell { background-color: var(--roulette-black); }
        .neutral-cell { background-color: transparent; }
        
        /* Highlight Classes - High contrast */
        .highlighted { border: 4px solid var(--highlight) !important; box-shadow: 0 0 10px var(--highlight); z-index: 10; }
        .highlight-a { border: 4px solid #FFC107 !important; box-shadow: 0 0 10px #FFC107; z-index: 10; } 
        .highlight-b { border: 4px solid navy !important; box-shadow: 0 0 10px navy; z-index: 10; } 
        .highlight-overlap { border: 4px solid forestgreen !important; box-shadow: 0 0 10px forestgreen; z-index: 15; }
        
        #split-controls { display: none; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        
        /* Wheel & Tables */
        .wheel-result {
            font-size: 60px; font-weight: bold; width: 120px; height: 120px;
            line-height: 120px; border-radius: 50%; margin: 20px auto; border: 5px solid gold; text-align:center;
        }
        .results-table {
            width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #222;
        }
        .results-table th, .results-table td {
            border: 1px solid white; padding: 12px; text-align: left;
        }
        .results-table th { background-color: #444; text-align: center; }
        .results-table td:nth-child(2), .results-table td:nth-child(3) { text-align: center; }
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="screen-main" class="screen active-screen">
        <h1>Roulette Probability Simulator</h1>
        <div class="menu-grid">
            <button onclick="selectMode('intro')">Introduction to Roulette</button>
            <button onclick="selectMode('mutual')">Mutual Exclusivity in Roulette</button>
            <button onclick="selectMode('expected')">Expected Value in Roulette</button>
            <button onclick="selectMode('conditional')">Conditional Probability in Roulette</button>
            <button onclick="selectMode('sandbox')">Roulette Sandbox</button>
        </div>
        <div id="mode-description" style="display:none; text-align: center; margin-top: 20px;">
            <p id="desc-text"></p>
            <div class="controls-row">
                <button onclick="beginGame()" style="background-color: var(--highlight); color: black;">Begin Game</button>
                <button onclick="document.getElementById('mode-description').style.display='none'">Choose Another</button>
            </div>
        </div>
    </div>

    <!-- Bet Selection Menu -->
    <div id="screen-intro-bets" class="screen">
        <h2 id="bet-menu-title">Select a Bet</h2>
        <p id="bet-menu-desc" style="text-align:center;">Select a bet to learn how it works.</p>
        <div id="bank-display-intro" style="text-align:center; font-size:20px; color:var(--highlight); margin-bottom:15px;">Bank: $10</div>
        <div class="menu-grid" id="bet-buttons-container"></div>
        <div class="controls-row" id="mutual-confirm-container" style="display:none;">
            <button onclick="setupMutualBoard()" style="background-color: var(--highlight); color: black;">Confirm Bets</button>
        </div>
    </div>

    <!-- Board Interaction -->
    <div id="screen-board" class="screen">
        <h2 id="current-bet-title">Bet Type</h2>
        <div id="bank-display-board" style="text-align:center; font-size:20px; color:var(--highlight); margin-bottom:15px;">Bank: $10</div>
        
        <div id="split-controls">
            <button id="btn-horizontal" onclick="setSplitMode('horizontal')">Horizontal Split</button>
            <button id="btn-vertical" onclick="setSplitMode('vertical')">Vertical Split</button>
        </div>

        <div class="board-wrapper" id="board-container">
            <!-- Left Side Outside Bets -->
            <div class="outside-bets-container">
                <div class="outside-col">
                    <div class="outside-cell neutral-cell" id="out-1-18" data-cat="outside" data-type="1 to 18 & 19 to 36" data-val="1-18">1 to 18</div>
                    <div class="outside-cell neutral-cell" id="out-even" data-cat="outside" data-type="Odd & Even" data-val="Even">EVEN</div>
                    <div class="outside-cell red-cell" id="out-red" data-cat="outside" data-type="Red & Black" data-val="Red">RED</div>
                    <div class="outside-cell black-cell" id="out-black" data-cat="outside" data-type="Red & Black" data-val="Black">BLACK</div>
                    <div class="outside-cell neutral-cell" id="out-odd" data-cat="outside" data-type="Odd & Even" data-val="Odd">ODD</div>
                    <div class="outside-cell neutral-cell" id="out-19-36" data-cat="outside" data-type="1 to 18 & 19 to 36" data-val="19-36">19 to 36</div>
                </div>
                <div class="outside-col">
                    <div class="outside-cell neutral-cell" id="out-1st12" data-cat="outside" data-type="Dozen" data-val="1st12">1st 12</div>
                    <div class="outside-cell neutral-cell" id="out-2nd12" data-cat="outside" data-type="Dozen" data-val="2nd12">2nd 12</div>
                    <div class="outside-cell neutral-cell" id="out-3rd12" data-cat="outside" data-type="Dozen" data-val="3rd12">3rd 12</div>
                </div>
            </div>
            <!-- Inside Bets -->
            <div class="inside-bets-container">
                <div class="board-row">
                    <div class="board-cell zero-cell" id="cell-0" data-cat="inside" data-num="0">0</div>
                    <div class="board-cell zero-cell" id="cell-37" data-cat="inside" data-num="37">00</div>
                </div>
                <div id="numbers-grid-container"></div>
            </div>
        </div>

        <div class="controls-row">
